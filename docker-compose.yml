
services:
  mysql:
    image: mysql:8.4
    container_name: open-day-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Root_OpenDay_2026!
      MYSQL_DATABASE: open_day_valle_grande
      MYSQL_USER: open_day_user
      MYSQL_PASSWORD: OpenDay_User_2026!
    ports:
      - "3308:3306"
    volumes:
      - open_day_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRoot_OpenDay_2026!"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: ./backend
    container_name: open-day-php
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  open_day_data:
