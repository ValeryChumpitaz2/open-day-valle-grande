services:
  mysql:
    image: mysql:8.4
    container_name: open-day-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: open_day_valle_grande
      MYSQL_USER: open_day_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - open_day_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: ./backend
    container_name: open-day-php
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: open_day_valle_grande
      DB_USER: open_day_user
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  open_day_data:
